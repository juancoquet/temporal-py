[project]
name = "temporal-py"
version = "0.1.0"
description = "A reference template for a Temporal (Python) orchestration layer: import-light contracts, one directory per activity/workflow, and a Panic failure seam."
readme = "README.md"
requires-python = "==3.14.*"
dependencies = [
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "temporalio>=1.32.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.15.12",
]

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

# The import package is `src` itself (src/__init__.py), not src/<project-name>/, so first-party
# imports read `from src.orchestration...`. Rename this to your own package if you prefer.
[tool.uv.build-backend]
module-name = "src"
module-root = ""

[tool.ruff]
line-length = 100
lint.select = ["ALL"]
lint.ignore = [
    "COM812",
    # No per-file copyright header requirement.
    "CPY",
    # Docstrings are written by discretion where they earn their place, not forced on every public
    # symbol. The whole pydocstyle family is off.
    "D",
    "EM101",
    "EM102",
    "FIX",
    "G004",
    "RET504",
    "TD",
    "TRY003",
    "TRY300",
]

[tool.ruff.lint.extend-per-file-ignores]
"tests/**/*.py" = [
    "S101",     # asserts are the point of a test
    "FBT",      # boolean args are fine in fakes/fixtures
    "PLR2004",  # magic values in comparisons read fine in tests
    "T201",     # allow print
    "S311",     # pseudo-random is fine in tests
    "ANN201",   # return types not required on test functions
    "ANN401",   # fakes may mirror Any-typed third-party signatures
    "ARG002",   # protocol-satisfying fakes accept args they don't use
    "N818",     # short throwaway exception names are fine in tests
    "TC",       # fakes use runtime annotations; TYPE_CHECKING-only imports would break them
    "SIM117",   # nested `with` blocks read fine in test setup
]

[tool.ruff.lint.flake8-type-checking]
# These bases (and the Temporal activity decorator) need their annotations evaluated at runtime:
# pydantic derives its schema from field annotations at class creation, and Temporal resolves an
# activity's argument type from its signature at registration to deserialise the payload. Without
# this, the type-checking rules would move those imports into `if TYPE_CHECKING` and break them.
runtime-evaluated-base-classes = ["pydantic.BaseModel", "src.primitives.FrozenBaseModel"]
runtime-evaluated-decorators = ["temporalio.activity.defn"]

[tool.basedpyright]
pythonVersion = "3.14"
# "all" is basedpyright's maximal mode: every strict-mode rule plus the based-only diagnostics
# (reportAny, reportExplicitAny, reportImplicitOverride, ...), all at error severity.
typeCheckingMode = "all"
include = ["src", "tests"]
reportMissingTypeStubs = false
reportUnusedCallResult = false
reportUnannotatedClassAttribute = false
# Test relaxations: fakes override third-party methods whose signatures are themselves Any-typed,
# satisfy protocols with parameters they don't use, and don't need @override to stay readable.
executionEnvironments = [
    { root = "tests", reportPrivateUsage = false, reportAny = false, reportExplicitAny = false, reportImplicitOverride = false, reportUnusedParameter = false },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Sizes follow Google's test-sizes guide; every test function carries exactly one.
markers = [
    "small: hermetic and in-process — no disk, network, database, or sleeps",
    "medium: single machine — localhost network, databases, and the filesystem allowed",
    "large: unrestricted — may hit real external services",
]
# Async tests are plain `async def` functions; auto mode runs them without a per-test decorator.
asyncio_mode = "auto"
